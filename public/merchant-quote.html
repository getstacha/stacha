<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Merchant quotation · Stacha</title><link rel="stylesheet" href="/styles.css"><script src="/merchant-quote.js" defer></script></head><body><main class="container" style="max-width:800px;margin:3rem auto;padding:1rem"><h1>Merchant quotation</h1><p>This private invitation provides access only to the request shown here. Identity is not independently verified.</p><div id="status" role="status">Loading request…</div><section id="request" class="card card-pad" hidden><h2 id="title"></h2><p id="details"></p><div id="messages"></div><div id="requests"></div><form id="quote"><h3>Submit or revise a quote</h3><label>Product or supply <input name="name" required maxlength="160"></label><label>Available quantity <input name="quantity" type="number" min="1" required></label><label>Price per unit (USD) <input name="price" type="number" min="0.01" step="0.01" required></label><label>Delivery fee (USD) <input name="fee" type="number" min="0" step="0.01" value="0"></label><label>Estimated delivery date <input name="deliveryDate" type="date" required></label><label>Quote expires <input name="expiresAt" type="datetime-local" required></label><label>Specifications, one per line <textarea name="specifications"></textarea></label><label>Commercial conditions <textarea name="conditions" maxlength="500"></textarea></label><button class="btn primary">Submit quotation</button> <button type="button" id="withdraw" class="btn small">Withdraw quote</button></form><p>Quotes do not reserve inventory. An accepted commitment requires a separate confirmation.</p></section></main></body></html>
